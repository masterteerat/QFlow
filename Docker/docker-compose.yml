services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qflow1234
      POSTGRES_DB: qflow_db
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - ../SQL/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      # SAMPLE/TEST data only (fake accounts, password Password123). DELETE this line in production.
      - ../SQL/data.sql:/docker-entrypoint-initdb.d/02_data.sql

  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      QR_SECRET: ${QR_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      APP_URL: ${APP_URL}
      NODE_ENV: ${NODE_ENV:-development}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-true}